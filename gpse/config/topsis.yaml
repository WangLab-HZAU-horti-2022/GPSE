# Formal model selection uses all training-only repeats. Holdout is reporting-only.
# Weights stay fixed at [0.8, 0.2]; neglog with epsilon=1e-12, then L2 normalization.
# Explicit alternative: --cv_stability_metric cv_std_within or cv_std_all_folds.
# cv_std_repeat is descriptive SD (ddof=1), never a standard error or confidence interval.
tasks:
  classification:
    criteria:
      - {name: cv_mean, type: max, weight: 0.8}
      - {name: cv_std_repeat, type: min, weight: 0.2}
  regression:
    criteria:
      - {name: cv_mean, type: max, weight: 0.8}
      - {name: cv_std_repeat, type: min, weight: 0.2}
